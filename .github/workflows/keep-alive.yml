name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/" > /dev/null 2>&1 || echo "Ping completed"
          echo "Supabase keep-alive ping sent at $(date)"
